name: Maven Package Build Manual

on:
  workflow_dispatch:

jobs:
  build-artifactory-server:
    runs-on: ubuntu-latest

    env:
      NAMESPACE: ${{ secrets.DEV_NAMESPACE_DOCKER_HUB }}
      SERVICE_NAME: artifactory-server
      SERVICE_LOCATION: artifacts/

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1

      - name: Setup branch and env
        run: |
          echo "BRANCH_NAME=$(echo ${{ github.ref }} | sed -e 's,.*/\(.*\),\1,')" >> $GITHUB_ENV
          echo "GPG_TTY=$(tty)" >> $GITHUB_ENV
      - name: Test Debian Bullseye repositories
        run: |
          docker run --rm \
            nginx@sha256:af296b188c7b7df99ba960ca614439c99cb7cf252ed7bbc23e90cfda59092305 \
            sh -c "sed -i 's|http://deb.debian.org/debian-security|https://security.debian.org/debian-security|g' /etc/apt/sources.list && \
                   apt-get update && \
                   apt-get install -y --no-install-recommends gnupg2 unzip wget zip openjdk-11-jdk ca-certificates"

      - name: Build image
        run: |
          cd "./${{ env.SERVICE_LOCATION }}"
          docker build . --file Dockerfile --tag ${{ env.SERVICE_NAME }}

      - name: Log into Docker Hub
        run: |
          echo "${{ secrets.RELEASE_DOCKER_HUB }}" | docker login -u "${{ secrets.ACTOR_DOCKER_HUB }}" --password-stdin

      - name: Push image
        run: |
          IMAGE_ID=$NAMESPACE/$SERVICE_NAME
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=$BRANCH_NAME

          docker tag $SERVICE_NAME $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
